name: Build Quest APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify consolidated native layout
        shell: bash
        run: |
          set -euo pipefail
          if find app/src/main/cpp -maxdepth 1 -type f -name 'q*.cmake' | grep -q .; then
            echo "Q-series CMake patch scripts must not return to the active source tree."
            exit 1
          fi
          if grep -Eq 'file\(READ|string\(REPLACE' app/src/main/cpp/CMakeLists.txt; then
            echo "Generated-source text patching is forbidden after Q17 consolidation."
            exit 1
          fi
          for source in \
            fo3-runtime.cpp \
            fo3-cell-world.cpp \
            fo3-static-nif-runtime.cpp \
            fo3-collision-runtime.cpp \
            fo3-player-controller-runtime.inc; do
            test -f "app/src/main/cpp/$source"
          done
          if grep -R -n '/home/runner/work/FalloutQuest' app/src/main/cpp \
              --include='*.cpp' --include='*.h' --include='*.inc'; then
            echo "Canonical sources must not contain CI build-directory paths."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable development signing key
        run: |
          base64 --decode app/falloutquest-dev.keystore.b64 > app/falloutquest-dev.keystore
          keytool -list \
            -keystore app/falloutquest-dev.keystore \
            -storepass falloutquest-dev \
            -alias falloutquest-dev >/dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-output.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalloutQuest-build-log
          path: build-output.log
          if-no-files-found: warn

      - name: Upload FalloutQuest APK
        uses: actions/upload-artifact@v4
        with:
          name: FalloutQuest-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
