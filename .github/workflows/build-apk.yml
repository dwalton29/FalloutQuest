name: Build Quest APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  vulkan-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan shader, software GPU and validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools spirv-tools libvulkan-dev libopenxr-dev libgles-dev libegl-dev libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers vulkan-validationlayers gdb
      - name: Compile and link production world and original LAND SPIR-V
        run: |
          python3 tests/render/test_vulkan_shaders.py
          python3 tests/render/test_spacewarp_shaders.py
          python3 tests/render/test_spacewarp_openxr.py
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-misleading-indentation -Iapp/src/main/cpp tests/render/spacewarp_gles_tests.cpp -lEGL -lGLESv2 -o /tmp/spacewarp-gles
          EGL_PLATFORM=surfaceless /tmp/spacewarp-gles
          python3 tools/build_vulkan_shaders.py --compiler glslangValidator --output /tmp/fq-vulkan-shaders
      - name: Verify Vulkan bridge preserves GLES fallback
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/render/mock -Iapp/src/main/cpp tests/render/vulkan_bridge_tests.cpp -o /tmp/fq-vulkan-bridge
          /tmp/fq-vulkan-bridge
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/render/mock -Iapp/src/main/cpp tests/render/native_frontend_tests.cpp -o /tmp/fq-native-frontend
          /tmp/fq-native-frontend
          python3 tests/render/test_native_dispatch.py
          python3 tests/render/test_exterior_texture_upload.py
      - name: Render original shaders through Vulkan multiview on software GPU
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        shell: bash
        run: |
          set -euo pipefail
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Wno-missing-field-initializers -DFQ_ENABLE_VULKAN \
            -I/tmp/fq-vulkan-shaders -Iapp/src/main/cpp tests/render/vulkan_world_gpu_tests.cpp \
            -lvulkan -lGLESv2 -o /tmp/fq-vulkan-world
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Wno-missing-field-initializers -DFQ_ENABLE_VULKAN \
            -I/tmp/fq-vulkan-shaders -Iapp/src/main/cpp -c app/src/main/cpp/rendering/vulkan/fo3-vulkan-renderer.cpp -o /tmp/fq-native-renderer.o
          if nm -u /tmp/fq-native-renderer.o | grep -Eq ' U (gl[A-Z]|egl[A-Z])'; then
            echo "Native Vulkan renderer must not depend on GLES/EGL driver functions"
            exit 1
          fi
          if ! /tmp/fq-vulkan-world 2>&1 | tee /tmp/fq-vulkan-validation.log; then
            gdb --batch -ex run -ex 'thread apply all bt 24' --args /tmp/fq-vulkan-world
            exit 1
          fi
          if grep -q 'Validation Error' /tmp/fq-vulkan-validation.log; then exit 1; fi
      - name: Collect software Vulkan reproduction files
        if: always()
        run: |
          mkdir -p /tmp/fq-vulkan-repro
          cp /tmp/fq-vulkan-world /tmp/fq-vulkan-repro/ || true
          cp /lib/x86_64-linux-gnu/libvulkan_lvp.so /lib/x86_64-linux-gnu/libGLESv2.so.2 /tmp/fq-vulkan-repro/ || true
          cp /usr/share/vulkan/icd.d/lvp*.json /tmp/fq-vulkan-repro/ || true
          cp /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json /lib/x86_64-linux-gnu/libVkLayer_khronos_validation.so /tmp/fq-vulkan-repro/ || true
          cp /tmp/fq-vulkan-validation.log /tmp/fq-vulkan-repro/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FalloutQuest-vulkan-host-repro
          path: /tmp/fq-vulkan-repro

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch reviewed native physics source
        run: |
          FQ_BULLET_SOURCE_DIR="$RUNNER_TEMP/falloutquest-bullet"
          echo "FQ_BULLET_SOURCE_DIR=$FQ_BULLET_SOURCE_DIR" >> "$GITHUB_ENV"
          git clone --depth 1 --branch 3.25 https://github.com/bulletphysics/bullet3.git "$FQ_BULLET_SOURCE_DIR"

      - name: Verify native source layout
        shell: bash
        run: |
          set -euo pipefail
          if find app/src/main/cpp -type f -name 'q*.cmake' | grep -q .; then
            echo "Generated CMake patch scripts must not return to the active source tree."
            exit 1
          fi
          if grep -Eq 'file\(READ|string\(REPLACE' app/src/main/cpp/CMakeLists.txt; then
            echo "Generated-source text patching is forbidden in the canonical native build."
            exit 1
          fi
          for source in \
            core/fo3-runtime.cpp \
            core/fo3-runtime-loop.inc \
            world/fo3-cell-world.cpp \
            world/fo3-worldspace-runtime.cpp \
            world/fo3-world-streaming.cpp \
            rendering/mesh/fo3-static-nif.cpp \
            physics/fo3-collision-runtime.cpp \
            player/fo3-player-controller.inc \
            data/fo3-esm-reader.cpp \
            npc/fo3-npc.cpp \
            vr/openxr-platform-prelude.h; do
            test -f "app/src/main/cpp/$source"
          done
          if grep -R -n '/home/runner/work/FalloutQuest' app/src/main/cpp \
              --include='*.cpp' --include='*.h' --include='*.inc'; then
            echo "Canonical sources must not contain CI build-directory paths."
            exit 1
          fi

      - name: Verify opaque state and asynchronous GPU diagnostics
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/render/mock -Iapp/src/main/cpp tests/render/gl_state_cache_tests.cpp -o /tmp/gl-state-tests
          /tmp/gl-state-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/render/mock -Iapp/src/main/cpp tests/render/terrain_depth_tests.cpp -o /tmp/terrain-depth-tests
          /tmp/terrain-depth-tests
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/render/geometry_optimisation_tests.cpp -o /tmp/geometry-optimisation-tests
          /tmp/geometry-optimisation-tests
          python3 tests/render/test_terrain_upload.py
          python3 tests/render/test_terrain_program_fallback.py
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/render/terrain_layer_fusion_tests.cpp -o /tmp/terrain-fusion-tests
          /tmp/terrain-fusion-tests
          python3 tests/render/test_hdr_rtt_target.py
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/pipboy/mock -Itests/render/mock -Itests/nif -Iapp/src/main/cpp -Iapp/src/main/cpp/data tests/render/notification_render_tests.cpp -o /tmp/notification-render-tests
          /tmp/notification-render-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/pipboy/mock -Itests/render/mock -Itests/nif -Iapp/src/main/cpp -Iapp/src/main/cpp/data tests/render/health_bar_render_tests.cpp -o /tmp/health-bar-render-tests
          /tmp/health-bar-render-tests
          python3 tests/render/test_notification_layering.py
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/render/mock -Iapp/src/main/cpp tests/render/opaque_timer_tests.cpp -o /tmp/opaque-timer-tests
          /tmp/opaque-timer-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/render/mock -Iapp/src/main/cpp tests/render/gpu_timestamp_tests.cpp -o /tmp/gpu-timestamp-tests
          /tmp/gpu-timestamp-tests
          python3 tests/render/test_shoulder_inventory_source.py
          python3 tests/render/test_pipboy_source.py
          python3 tests/render/test_opaque_hot_path.py
          python3 tests/render/test_indexed_nif_source.py
          python3 tests/render/test_lod_diagnostics.py
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools libegl1 libgl1-mesa-dri
          python3 tests/render/test_world_shader.py
          python3 tests/render/test_notification_shader.py
          python3 tests/render/test_interior_lighting.py
          python3 tests/render/test_font_consumers.py
          python3 tests/render/test_gpu_skin_shader.py
          python3 tests/render/test_terrain_fusion_shader.py
          python3 tests/render/test_actor_skin_scope.py
          g++ -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/render/actor_skinning_tests.cpp app/src/main/cpp/npc/fo3-actor-animation.cpp -o /tmp/actor-skin-tests
          /tmp/actor-skin-tests

      - name: Verify scene render dispatch and loading isolation
        run: |
          python3 tests/render/test_render_dispatch.py
          python3 tests/render/test_hdr_pass_order.py
          python3 tests/render/test_capture_script.py
          python3 tests/render/test_loading_pipeline.py

      - name: Verify stereo visibility and reflection reuse
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/render/terrain_clip_tests.cpp -o /tmp/terrain-clip-tests
          /tmp/terrain-clip-tests
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/render/prepared_frustum_tests.cpp -o /tmp/prepared-frustum-tests
          /tmp/prepared-frustum-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/render/performance_capture_tests.cpp -o /tmp/perf-capture-tests
          /tmp/perf-capture-tests
          python3 tests/render/test_performance_capture.py
          g++ -std=c++17 -Wall -Wextra -Werror tests/render/render_policy_tests.cpp -o /tmp/render-policy-tests
          /tmp/render-policy-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/render/quest_quality_tests.cpp -o /tmp/quest-quality-tests
          /tmp/quest-quality-tests
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/render/conservative_occlusion_tests.cpp -o /tmp/occlusion-tests
          /tmp/occlusion-tests
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/render/occlusion_runtime_tests.cpp -o /tmp/occlusion-runtime-tests
          /tmp/occlusion-runtime-tests

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test Steam install discovery
        run: |
          mkdir -p build/host-install
          javac -d build/host-install app/src/main/java/com/falloutquest/app/GameInstall.java tests/install/GameInstallTests.java
          java -cp build/host-install com.falloutquest.app.GameInstallTests

      - name: Test shared BSA reader on host
        run: |
          cmake -S tests/assets -B build/host-assets
          cmake --build build/host-assets --parallel 2
          ctest --test-dir build/host-assets --output-on-failure

      - name: Test world residency and scene preparation on host
        run: |
          cmake -S tests/world -B build/host-world
          cmake --build build/host-world --parallel 2
          ctest --test-dir build/host-world --output-on-failure

      - name: Test authored collision selection and publication on host
        run: |
          cmake -S tests/physics -B build/host-physics
          cmake --build build/host-physics --parallel 2
          ctest --test-dir build/host-physics --output-on-failure
          python3 tests/physics/test_scene_collision_source.py

      - name: Test loading NIF materials on host
        run: |
          cmake -S tests/nif -B build/host-nif
          cmake --build build/host-nif --parallel 2
          ctest --test-dir build/host-nif --output-on-failure

      - name: Test player stats and inventory on host
        run: |
          cmake -S tests/player -B build/host-player
          cmake --build build/host-player --parallel 2
          ctest --test-dir build/host-player --output-on-failure

      - name: Test audio catalog on host
        run: |
          cmake -S tests/audio -B build/host-audio
          cmake --build build/host-audio --parallel 2
          ctest --test-dir build/host-audio --output-on-failure

      - name: Restore stable development signing key
        run: |
          base64 --decode app/falloutquest-dev.keystore.b64 > app/falloutquest-dev.keystore
          keytool -list \
            -keystore app/falloutquest-dev.keystore \
            -storepass falloutquest-dev \
            -alias falloutquest-dev >/dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build matched Debug and O2 APKs
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug assembleProfile --stacktrace 2>&1 | tee build-output.log

      - name: Verify actual ARM64 compiler optimisation and diagnostics
        run: python3 tools/check_native_profile.py

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalloutQuest-build-log
          path: build-output.log
          if-no-files-found: warn

      - name: Upload FalloutQuest APK
        uses: actions/upload-artifact@v4
        with:
          name: FalloutQuest-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload FalloutQuest native O2 profile APK
        uses: actions/upload-artifact@v4
        with:
          name: FalloutQuest-O2-profile
          path: app/build/outputs/apk/profile/app-profile.apk
          if-no-files-found: error
