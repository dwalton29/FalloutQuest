name: Build Quest APK

on:
  push:
    branches: [main, q3-openxr, fix/megaton-land-elevation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable development signing key
        run: |
          base64 --decode app/falloutquest-dev.keystore.b64 > app/falloutquest-dev.keystore
          keytool -list \
            -keystore app/falloutquest-dev.keystore \
            -storepass falloutquest-dev \
            -alias falloutquest-dev >/dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `tools` was the legacy pre-cmdline-tools SDK package and is no longer
          # published by Google's current repository. setup-android already installs
          # cmdline-tools; request only the package we actually need here.
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-output.log

      - name: Capture generated native sources for consolidation
        if: always()
        shell: bash
        run: |
          rm -rf consolidation-generated
          mkdir -p consolidation-generated
          if [ -d app/.cxx ]; then
            cp -a app/.cxx consolidation-generated/app-cxx
          fi

      - name: Upload generated native sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalloutQuest-generated-native
          path: consolidation-generated
          if-no-files-found: warn

      - name: Validate Q17 consolidated runtime
        id: q17validate
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python3 tools/q17-consolidate.py
          rm -rf app/.cxx app/build
          gradle assembleDebug --stacktrace 2>&1 | tee q17-consolidation-build.log

      - name: Upload validated Q17 source
        if: always() && steps.q17validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FalloutQuest-q17-source
          path: |
            app/src/main/cpp
            README.md
            docs/ARCHITECTURE.md
            q17-consolidation-build.log
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalloutQuest-build-log
          path: build-output.log
          if-no-files-found: warn

      - name: Upload FalloutQuest APK
        uses: actions/upload-artifact@v4
        with:
          name: FalloutQuest-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
