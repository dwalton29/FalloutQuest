plugins {
    id 'com.android.application'
}

android {
    namespace 'com.falloutquest.app'
    compileSdk 35
    ndkVersion '27.0.12077973'

    // Development-only key committed so ephemeral GitHub Actions runners
    // produce update-compatible APKs. Never use this key for a release build.
    signingConfigs {
        debug {
            storeFile file('falloutquest-dev.keystore')
            storePassword 'falloutquest-dev'
            keyAlias 'falloutquest-dev'
            keyPassword 'falloutquest-dev'
        }
    }

    defaultConfig {
        applicationId 'com.falloutquest.app'
        minSdk 29
        targetSdk 35
        versionCode 243
        versionName '0.100.2-terrain-recovery'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        // The same source and app ID as Debug, but with native C++ -O2.
        // Keep Android debuggability, the dev signing key, and FQPerf capture.
        // This build type is for a controlled A/B comparison, NOT release.
        profile {
            initWith debug
            matchingFallbacks = ['debug']
            debuggable true
            versionNameSuffix '-O2'
            externalNativeBuild {
                cmake {
                    arguments '-DFALLOUTQUEST_OPTIMIZED_PROFILE=ON'
                }
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.61'
}
